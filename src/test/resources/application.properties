# Test configuration: separate in-memory H2 database in MySQL compatibility mode,
# the working MySQL database "books" is not touched (no Docker needed).
# This file shadows src/main/resources/application.properties on the test classpath.
spring.application.name=lab1-test

spring.datasource.url=jdbc:h2:mem:books_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway runs the same migrations as in production (PRODUCT, authors id=1, 2, book id=1);
# Hibernate only validates the schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

# Swagger / OpenAPI (LR5): same paths as in the main configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# LR6: Feign client OrderClient. By default the tests point it to a closed port, so that no test can reach
# an application running on 8081; the Feign tests (AbstractFeignIntegrationTest) override the URL with
# the port of the test server, the fallback test sets it explicitly.
clients.order-service.url=http://localhost:1/order-service
spring.cloud.openfeign.client.config.order-service.connect-timeout=2000
spring.cloud.openfeign.client.config.order-service.read-timeout=3000
spring.cloud.openfeign.client.config.order-service.logger-level=full
spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.timelimiter.configs.default.timeout-duration=20s
logging.level.io.hexlet.spring.client=INFO
