# Profile "h2": run without Docker (mvn spring-boot:run -Dspring-boot.run.profiles=h2).
# In-memory H2 in MySQL compatibility mode; Flyway applies the same migrations.
spring.datasource.url=jdbc:h2:mem:books;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
