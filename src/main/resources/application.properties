spring.application.name=lab1
server.port=8081

# Local run (mvn spring-boot:run): MySQL from docker-compose.yml (`docker compose up -d mysql`).
# In Docker the app service overrides these values with environment variables
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# (jdbc:mysql://mysql:3306/books). Without Docker: --spring.profiles.active=h2.
spring.datasource.url=jdbc:mysql://localhost:3306/books
spring.datasource.username=books_user
spring.datasource.password=books_password

# Schema is managed by Flyway only; Hibernate just validates it against the entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway: migrations from src/main/resources/db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# H2 console is enabled only in the h2 profile (application-h2.properties)
spring.h2.console.enabled=false

# Swagger / OpenAPI (LR5, springdoc-openapi): equivalent of the application.yml from the methodology
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ===== LR6: Spring Cloud OpenFeign (@FeignClient OrderClient) =====
# Address of the Order-Service. There is no service registry (Eureka), so the client gets the URL explicitly.
# By default it is the Order-Service stub inside this application (/order-service, see OrderServiceController);
# can be overridden: --clients.order-service.url=http://other-host:port/order-service
clients.order-service.url=http://localhost:${server.port}/order-service

# Timeouts of the Feign client "order-service" (milliseconds); "default" applies to all clients
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000
spring.cloud.openfeign.client.config.order-service.connect-timeout=2000
spring.cloud.openfeign.client.config.order-service.read-timeout=3000
# Logging level of the client (also set by the bean FeignClientConfig.feignLoggerLevel)
spring.cloud.openfeign.client.config.order-service.logger-level=full

# Fallback (OrderClientFallback): Spring Cloud CircuitBreaker + Resilience4j instead of Hystrix.
# Without this property the attribute @FeignClient(fallback = ...) is ignored.
spring.cloud.openfeign.circuitbreaker.enabled=true
# Resilience4j TimeLimiter cuts the call after 1 s by default - longer than the Feign timeouts with retries
# (3 attempts x (2 s + 3 s) + pauses), otherwise the fallback would fire before the client timeouts.
resilience4j.timelimiter.configs.default.timeout-duration=20s

# One-line records of OneLineLogger (SLF4J, level INFO)
logging.level.io.hexlet.spring.client=INFO
